services:
  postgres:
    image: postgres:16-alpine
    container_name: mmkeyhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mmkeyhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mmkeyhub_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-mmkeyhub_db}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mmkeyhub} -d ${POSTGRES_DB:-mmkeyhub_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mmkeyhub_net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mmkeyhub_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: ${API_PORT:-4000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-mmkeyhub}:${POSTGRES_PASSWORD:-mmkeyhub_dev_password}@postgres:5432/${POSTGRES_DB:-mmkeyhub_db}?schema=public}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-${ENCRYPTION_MASTER_KEY}}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-${ENCRYPTION_KEY}}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      ORDER_TOKEN_SECRET: ${ORDER_TOKEN_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_ADMIN_GROUP_ID: ${TELEGRAM_ADMIN_GROUP_ID}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_MINI_APP_URL: ${TELEGRAM_MINI_APP_URL:-}
      TELEGRAM_INIT_DATA_TTL_SECONDS: ${TELEGRAM_INIT_DATA_TTL_SECONDS:-86400}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      UPLOAD_DIR: /app/uploads
      MAX_RECEIPT_SIZE_MB: ${MAX_RECEIPT_SIZE_MB:-5}
      APP_URL: ${APP_URL:-http://localhost}
      RUN_SEED_ON_BOOT: ${RUN_SEED_ON_BOOT:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-gemini-2.5-flash}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      DAILY_SUMMARY_TIMEZONE: ${DAILY_SUMMARY_TIMEZONE:-Asia/Yangon}
    volumes:
      - receipt_uploads:/app/uploads
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - mmkeyhub_net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-MMKeyHub}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-MMKeyHubBot}
        NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-en}
        NEXT_PUBLIC_ADMIN_PORTAL_PATH: ${NEXT_PUBLIC_ADMIN_PORTAL_PATH:-${ADMIN_PORTAL_PATH:-/admin}}
    container_name: mmkeyhub_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-MMKeyHub}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-MMKeyHubBot}
      NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-en}
      ADMIN_PORTAL_PATH: ${ADMIN_PORTAL_PATH:-/admin}
      NEXT_PUBLIC_ADMIN_PORTAL_PATH: ${NEXT_PUBLIC_ADMIN_PORTAL_PATH:-${ADMIN_PORTAL_PATH:-/admin}}
      ADMIN_ALLOWED_HOST: ${ADMIN_ALLOWED_HOST:-}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - mmkeyhub_net

  nginx:
    image: nginx:1.27-alpine
    container_name: mmkeyhub_nginx
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    networks:
      - mmkeyhub_net

  certbot:
    image: certbot/certbot:latest
    container_name: mmkeyhub_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    profiles:
      - ssl
    networks:
      - mmkeyhub_net

volumes:
  postgres_data:
    driver: local
  receipt_uploads:
    driver: local
  certbot_www:
    driver: local
  certbot_conf:
    driver: local

networks:
  mmkeyhub_net:
    driver: bridge
